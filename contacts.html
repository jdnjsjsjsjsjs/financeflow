<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Контакты — FinanceFlow</title>

  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<!-- HEADER -->
<nav class="navbar is-fixed-top is-white">
  <div class="container">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-bold" href="index.html">
        FinanceFlow
      </a>
    </div>
    <div class="navbar-menu">
      <div class="navbar-end">
        <a class="navbar-item" href="index.html">Главная</a>
        <a class="navbar-item" href="faq.html">FAQ</a>
        <a class="navbar-item is-active" href="contacts.html">Контакты</a>
      </div>
    </div>
  </div>
</nav>

<section class="section" style="margin-top: 70px;">
  <div class="container">
    <h1 class="title has-text-centered">Свяжитесь с нами</h1>

    <div class="columns">
      <div class="column is-6">
        <form id="feedbackForm">
          <div class="field">
            <label class="label">Имя <span class="has-text-danger">*</span></label>
            <div class="control has-icons-left">
              <input class="input" type="text" id="fullname" placeholder="Иванов Иван Иванович" required>
              <span class="icon is-small is-left">
                <i class="fas fa-user"></i>
              </span>
            </div>
            <p class="help" id="fullnameHelp">Введите фамилию, имя и отчество</p>
          </div>

          <div class="field">
            <label class="label">Email <span class="has-text-danger">*</span></label>
            <div class="control has-icons-left">
              <input class="input" type="email" id="email" placeholder="example@mail.ru" required>
              <span class="icon is-small is-left">
                <i class="fas fa-envelope"></i>
              </span>
            </div>
            <p class="help" id="emailHelp">Введите корректный email адрес</p>
          </div>

          <div class="field">
            <label class="label">Телефон <span class="has-text-danger">*</span></label>
            <div class="control has-icons-left">
              <input class="input" type="tel" id="phone" placeholder="+7 (___) __-__-__" required>
              <span class="icon is-small is-left">
                <i class="fas fa-phone"></i>
              </span>
            </div>
            <p class="help" id="phoneHelp">Формат: +7 (ХХХ) ХХ-ХХ-ХХ</p>
          </div>

          <div class="field">
            <label class="label">Сообщение</label>
            <div class="control">
              <textarea class="textarea" id="message" rows="5" placeholder="Текст сообщения..."></textarea>
            </div>
            <p class="help" id="messageHelp">До 500 символов</p>
          </div>

          <div class="field">
            <label class="checkbox">
              <input type="checkbox" id="agreement" required>
              Согласен на обработку персональных данных
            </label>
          </div>

          <div class="field">
            <button class="button is-primary" type="submit">
              <span class="icon">
                <i class="fas fa-paper-plane"></i>
              </span>
              <span>Отправить</span>
            </button>
          </div>
        </form>
      </div>

      <div class="column is-6">
        <h2 class="title is-4">Контакты</h2>
        <p><i class="fas fa-map-marker-alt"></i> Москва</p>
        <p><i class="fas fa-envelope"></i> support@financeflow.ru</p>
        <p><i class="fas fa-phone"></i> +7 (999) 000-00-00</p>
      </div>
    </div>
  </div>
</section>

<footer id="contact" class="footer">
  <div class="content has-text-centered">
    <p>
      <strong>FinanceFlow</strong><br>
      Email: support@financeflow.ru<br>
    </p>
    <p>
      <a href="#"><i class="fab fa-telegram"></i></a>
      &nbsp;
      <a href="#"><i class="fab fa-vk"></i></a>
      &nbsp;
      <a href="#"><i class="fab fa-github"></i></a>
    </p>
    <p>© 2026 FinanceFlow</p>
  </div>
</footer>

<script src="scripts/validation.js"></script>
<script src="scripts/consoleLogger.js"></script>
</body>
</html>
